bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 30 #10
    default_server_timeout: 120 #20
    wait_for_service_timeout: 1800 #1000
    action_server_result_timeout: 900.0
    #default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    default_nav_to_pose_bt_xml: "/home/ef-software/ros2_ws/src/mdx_ugv/behavior_trees/navigate_to_pose_no_clear.xml"
    default_nav_through_poses_bt_xml: "/home/ef-software/ros2_ws/src/mdx_ugv/behavior_trees/navigate_through_poses_no_clear.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
