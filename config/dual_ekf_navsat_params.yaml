ekf_filter_node_odom: # local odom EKF (odom -> base_link)
  ros__parameters:
    use_sim_time: true
    frequency: 15.0
    # two_d_mode: true # Recommended to use 2d mode for nav2 in mostly planar environments
    two_d_mode: false # set to true to consider the z axis also, the ugv can go in uneven terrains(3d lidar used)
    print_diagnostics: true
    debug: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link 
    world_frame: odom
    dynamic_process_noise_covariance: false
    
    odom0: /odom 
    odom0_config: [true, true, false, # x,y,z
                   false, false, false,  # roll,pitch,yaw
                   true,  true,  true,   # vx,vy,vz
                   false, false, true,   # vroll,vpitch,vyaw
                   false, false, false]  # ax, ay, az
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu
    imu0_config: [false, false, false,   # x,y,z 
                  false, false, true,  # roll,pitch,yaw
                  false, false, false,   # vx,vy,vz
                  false, false, true,  # vroll,vpitch,vyaw
                  false, false, false] # ax,ay,az
    imu0_differential: false  # If using a real robot you might want to set this to true, since usually absolute measurements from real imu's are not very accurate
    imu0_relative: false
    imu0_queue_size: 10
    # imu0_remove_gravitational_acceleration: true
    # imu0_pose_rejection_threshold: 0.1
    # imu0_angular_velocity_rejection_threshold: 0.1
    # imu0_linear_acceleration_rejection_threshold: 0.1

    use_control: False

ekf_filter_node_map: # global map EKF (map -> odom) - IMU + GPS + Odom fused
  ros__parameters:
    use_sim_time: true
    frequency: 15.0
    # two_d_mode: true  # Recommended to use 2d mode for nav2 in mostly planar environments
    two_d_mode: false # set to true to consider the z axis also, the ugv can go in uneven terrains(3d lidar used)
    print_diagnostics: true
    debug: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link 
    world_frame: map
    dynamic_process_noise_covariance: false

    odom0: /odom
    odom0_config: [false, false, false, # x,y,z
                  false, false, false,  # roll, pitch, yaw
                  true,  true,  true,   # vx, vy, vz
                  false, false, true,   # vroll, vpitch, vyaw
                  false, false, false]  # ax, ay, az
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false,  false,  true,
                  false, false, false,
                  false,  false,  true,
                  false,  false,  false]
    imu0_differential: false  # If using a real robot you might want to set this to true, since usually absolute measurements from real imu's are not very accurate
    imu0_relative: false
    imu0_queue_size: 10
    # imu0_remove_gravitational_acceleration: false
    # imu0_remove_gravitational_acceleration: true
    # imu0_pose_rejection_threshold: 0.1
    # imu0_angular_velocity_rejection_threshold: 0.1
    # imu0_linear_acceleration_rejection_threshold: 0.1

    gps0: /odometry/gps # output from navsat_transform_node
    gps0_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    gps0_queue_size: 10
    gps0_differential: false
    gps0_relative: false

    use_control: false
navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true  # if gps data is unavailable, yaw data from odom is used for the heading value
    wait_for_datum: false #true  must be set as true in real time
    datum: [17.4644400000003, 78.36638039729644, 0.0]