bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.1
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 1.0
    FollowPath:
      # plugin: "nav2_rotation_shim_controller::RotationShimController"
      # #primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"    # primary controller   
      # primary_controller: teb_local_planner::TebLocalPlannerROS    # primary controller   
      # angular_dist_threshold: 0.523599 #(30 degree) 0.785  #(45 degree)
      # forward_sampling_distance: 0.5
      # angular_disengage_threshold: 0.3925
      # rotate_to_heading_angular_vel: 1.0 #1.8
      # max_angular_accel: 1.0
      # simulate_ahead_time: 1.0
      # rotate_to_goal_heading: false
      # rotate_to_heading_once: false
      # closed_loop: true
      # use_path_orientations: true
      #RPP parameters
      # desired_linear_vel: 1.5
      # lookahead_dist: 2.0 # not being used when use_velocity_scaled_lookahead_dist: true
      # min_lookahead_dist: 1.6
      # max_lookahead_dist: 5.0
      # lookahead_time: 1.5
      # rotate_to_heading_angular_vel: 0.5
      # transform_tolerance: 0.12
      # use_velocity_scaled_lookahead_dist: true
      # min_approach_linear_velocity: 0.05
      # approach_velocity_scaling_dist: 0.6
      # use_collision_detection: true
      # max_allowed_time_to_collision_up_to_carrot: 1.5
      # use_regulated_linear_velocity_scaling: true
      # use_fixed_curvature_lookahead: false
      # interpolate_curvature_after_goal: true
      # curvature_lookahead_dist: 1.4
      # use_cost_regulated_linear_velocity_scaling: true
      # cost_scaling_dist: 1.5
      # cost_scaling_gain: 1.0
      # regulated_linear_scaling_min_radius: 0.9
      # regulated_linear_scaling_min_speed: 0.25
      # use_rotate_to_heading: true
      # allow_reversing: false
      # rotate_to_heading_min_angle: 0.785
      # max_angular_accel: 1.0
      # max_robot_pose_search_dist: 10.0
      # min_distance_to_obstacle: 5.0
      plugin: teb_local_planner::TebLocalPlannerROS

      teb_autosize: 1.0
      dt_ref: 0.1
      dt_hysteresis: 0.02
      max_samples: 500
      global_plan_overwrite_orientation: true
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 10.0
      global_plan_viapoint_sep: 0.5
      global_plan_prune_distance: 1.0
      exact_arc_length: False
      feasibility_check_no_poses: 3
      publish_feedback: False
          
      # Robot
      max_vel_x: 2.0
      max_vel_theta: 1.0
      acc_lim_x: 2.0
      acc_lim_theta: 2.5
      min_turning_radius: 0.0
      max_vel_x_backwards: 0.15

      footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
        type: "line" #"circular"
        #radius: 1.42 # for type "circular"
        line_start: [-1.0, 0.0] # for type "line" #chassis length = 2.33m
        line_end: [1.0, 0.0]

      # GoalTolerance        
      free_goal_vel: False
          
      # Obstacles     
      min_obstacle_dist: 0.6
      inflation_dist: 0.8
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.5
      obstacle_poses_affected: 20

      dynamic_obstacle_inflation_dist: 0.8
      include_dynamic_obstacles: true 

      #Speed Scaling
      speed_scaling_lookahead_dist: 0.0

      # costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
      # costmap_converter_spin_thread: True
      # costmap_converter_rate: 5

      # Optimization          
      no_inner_iterations: 6
      no_outer_iterations: 5
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 100.0
      weight_max_vel_theta: 100.0
      weight_acc_lim_x: 100.0
      weight_acc_lim_theta: 100.0
      weight_kinematics_nh: 10000.0
      weight_kinematics_forward_drive: 10000.0
      weight_kinematics_turning_radius: 1000.0
      weight_optimaltime: 70.0 
      weight_shortest_path: 40.0
      weight_obstacle: 15.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 25.0 
      weight_dynamic_obstacle_inflation: 0.05
      weight_viapoint: 30.0
      weight_adapt_factor: 2.0

      # Homotopy Class Planner
      enable_homotopy_class_planning: false
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True

      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

      # Recovery 
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
  
local_costmap:
  local_costmap:
    ros__parameters:
      #footprint: "[[1.165, 0.804], [1.165, -0.804], [-1.165, -0.804], [-1.165, 0.804]]"
      footprint: "[[1.2, 1.1], [1.2, -1.1], [-1.2, -1.1], [-1.2, 1.1]]"
      # with this footprint the inscribed radius is 0.804((0.804*2)/2)
      # the circumscribed radius = 1.4158 (√((1.165*2)+(0.804*2))
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 0.12
      global_frame: odom
      robot_base_frame: base_link
      #robot_radius: 1.42
      use_sim_time: True
      rolling_window: true
      width: 70
      height: 70
      resolution: 0.05
      plugins: ["stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.8 # should be > circumscribed radius
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.8 #1.5 # set this -1 if you want the voxels stay
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.12
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_mark #lidar_clear
        lidar_mark:
          data_type: PointCloud2
          topic: /ouster_points
          # topic: /zed_camera/depth/points
          marking: true
          clearing: false
          obstacle_range: 30.0          # meters
          min_obstacle_height: 0.15     # default 0, meters
          max_obstacle_height: 5.0     # default 3, meters,
          expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false          # default false, for laser scans
          filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on     voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
        lidar_clear:
          enabled: true                #default true, can be toggled on/off with associated service call
          data_type: PointCloud2
          topic: /ouster_points
          # topic: /zed_camera/depth/points
          marking: false
          clearing: true
          max_z: 8.0                  # default 0, meters
          min_z: 0.1                  # default 10, meters
          vertical_fov_angle: 0.6     # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_padding: 0.05    # 3D Lidar only. Default 0, in meters 
          horizontal_fov_angle: 3.14  # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
          decay_acceleration: 5.0     # default 0, 1/s^2. 
          model_type: 1               # default 0, model type for frustum. 0=depth camera, 1=3d lidar
      always_send_full_costmap: True

# GPS Way Point Follower change Static layer removed    
global_costmap:
  global_costmap:
    ros__parameters:
      #footprint: "[[1.165, 0.804], [1.165, -0.804], [-1.165, -0.804], [-1.165, 0.804]]"
      footprint: "[[1.2, 1.1], [1.2, -1.1], [-1.2, -1.1], [-1.2, 1.1]]"
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 0.12
      global_frame: map
      robot_base_frame: base_link
      #robot_radius: 1.42
      use_sim_time: True
      resolution: 0.05
      # When using GPS navigation you will potentially traverse huge environments which are not practical to
      # fit on a big static costmap. Thus it is recommended to use a rolling global costmap large enough to
      # contain each pair of successive waypoints. See: https://github.com/ros-planning/navigation2/issues/2174
      rolling_window: True
      width: 140
      height: 140
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud2
        max_obstacle_height: 2.0
        footprint_clearing_enabled: true
        combination_method: 1
        pointcloud2:
          topic: /ouster_points
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 30.0
          obstacle_min_range: 1.3
          raytrace_max_range: 30.5
          raytrace_min_range: 1.3
          max_obstacle_height: 5.0
          min_obstacle_height: 0.15
          clearing: True
          marking: True  
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.8 # should be > circumscribed radius
      always_send_full_costmap: True

planner_server:  
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    service_introspection_mode: "disabled"   
    # GridBased:
    #   plugin: "nav2_smac_planner/SmacPlanner2D" 
    #   tolerance: 0.05                        # tolerance for planning if unable to reach exact pose, in meters
    #   downsample_costmap: false             # whether or not to downsample the map
    #   downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
    #   allow_unknown: true                   # allow traveling in unknown space
    #   max_iterations: -1               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
    #   max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
    #   max_planning_time: 5.0                # max time in s for planner to plan, smooth
    #   cost_travel_multiplier: 3.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
    #   use_final_approach_orientation: true # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
    #   smoother:
    #     max_iterations: 1000
    #     w_smooth: 0.3
    #     w_data: 0.2
    #     tolerance: 1.0e-10
    #     do_refinement: true
    #     refinement_num: 2
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice" # In Iron and older versions, "/" was used instead of "::"
      allow_unknown: true                 # Allow traveling in unknown space
      tolerance: 0.05                     # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.
      max_iterations: -1             # Maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0              # Max time in s for planner to plan, smooth
      analytic_expansion_ratio: 3.5       # The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 3.0  # For Hybrid/Lattice nodes The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting
      analytic_expansion_max_cost: 200.0  # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: false  #  Whether or not to override the maximum cost setting if within critical distance to goal (ie probably required)
      reverse_penalty: 2.0                # Penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.05                # Penalty to apply if motion is changing directions (L to R), must be >= 0
      non_straight_penalty: 1.1          # Penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 2.0                   # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      rotation_penalty: 5.0               # Penalty to apply to in-place rotations, if minimum control set contains them
      retrospective_penalty: 0.015
      # lattice_filepath: ""              # The filepath to the state lattice graph
      lookup_table_size: 20.0             # Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false     # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      allow_reverse_expansion: false      # If true, allows the robot to use the primitives to expand in the mirrored opposite direction of the current robot's orientation (to reverse).
      coarse_search_resolution: 1         # Number of bins to skip when doing a coarse search for the path. Only used for all_direction goal heading mode.
      goal_heading_mode: "DEFAULT"        # DEFAULT, BIDIRECTIONAL, ALL_DIRECTION
      smooth_path: False 
    # GridBased:
    #   plugin: "nav2_navfn_planner/NavfnPlanner"
    #   tolerance: 0.05
    #   use_astar: false
    #   allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: "base_link"
    transform_tolerance: 0.12
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.12
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    behavior_plugins:
      ["spin", "assisted_teleop", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: false
      max_rotational_vel: 0.6
      min_rotational_vel: 0.3
      rotational_acc_lim: 1.8
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
      projection_time: 1.0
      simulation_time_step: 0.1
      cmd_vel_teleop: cmd_vel_teleop
      #use this remap command when teleop manually
      #ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r /cmd_vel:=/cmd_vel_teleop
      enable_stamped_cmd_vel: false
    backup:
      plugin: "nav2_behaviors/BackUp"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: false
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: false
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    service_introspection_mode: "disabled"
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.0]
    min_velocity: [-2.0, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.01
    enable_stamped_cmd_vel: False
    use_realtime_priority: False

collision_monitor:
  ros__parameters:
    enabled: true
    use_sim_time: True
    enable_stamped_cmd_vel: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.12
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 1.0
    polygons: ["PolygonSlow", "PolygonStop"]      
    PolygonSlow:
      type: "polygon"
      points: [1.7, 1.1, 1.7, -1.1, -1.7, -1.1, -1.7, 1.1]
      action_type: "slowdown"
      min_points: 3  # max_points: 3 for Humble
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
    PolygonStop:
      enabled: false
      type: "polygon"
      points: [1.5, 1.0, 1.5, -1.0, -1.5, -1.0, -1.5, 1.0]
      action_type: "stop"
      min_points: 3  # max_points: 3 for Humble
      visualize: True
      polygon_pub_topic: "polygon_stop"
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 5
      visualize: true
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/ouster_points"
      transport_type: "raw"
      min_height: 0.15
      max_height: 5.0
      min_range: 0.1
      enabled: True

route_server:
  ros__parameters:
    base_frame: "base_link"                       # Robot's base frame
    route_frame: "map"                            # Global reference frame
    path_density: 0.05                            # Density of points for generating the dense nav_msgs/Path from route (m)
    max_iterations: 0                             # Maximum number of search iterations, if 0, uses maximum possible
    max_planning_time: 2.0                        # Maximum planning time (seconds)
    smoothing_corners: true                       # Whether to smooth corners formed by adjacent edges or not
    smoothing_radius: 1.0                         # Radius of corner to fit into the corner
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    tracker_update_rate: 50.0
    aggregate_blocked_ids: false                  # Whether to aggregate the blocked IDs reported by route operations over the lifespan of the navigation request or only use the currently blocked IDs.
    boundary_radius_to_achieve_node: 1.0          # Radius (m) near boundary nodes (e.g. start/end) to enable evaluation of achievement metric
    radius_to_achieve_node: 2.0                   # Radius (m) near route nodes as preliminary condition for evaluation of achievement metric
    max_prune_dist_from_edge: 8.0                       # Max distance from an edge to consider pruning it as in-progress (e.g. if we're too far away from the edge, its nonsensical to prune it)
    min_prune_dist_from_goal: 0.15                      # Min distance from goal node away from goal pose to consider goal node pruning as considering it as being passed (in case goal pose is very close to a goal node, but not exact)
    min_prune_dist_from_start: 0.10                     # Min distance from start node away from start pose to consider start node pruning as considering it as being passed (in case start pose is very close to a start node, but not exact)
    prune_goal: true                              # Whether pruning the goal nodes from the route due to being past the goal pose requested is possible (pose requests only)
    smooth_corners: true
    graph_filepath: ""
    graph_file_loader: ""
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"