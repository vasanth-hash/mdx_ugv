      max_vel_x_backwards: 0.11
      max_vel_theta: 1.0 #2.0
      acc_lim_x: 1.4 #2.3
      acc_lim_theta: 0.9 #3.0
      min_turning_radius: 0.0
      cmd_angle_instead_rotvel: false
      use_propoertional_saturation: false

