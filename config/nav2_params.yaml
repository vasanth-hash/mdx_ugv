      # #primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"    # primary controller   
      # primary_controller: teb_local_planner::TebLocalPlannerROS    # primary controller   
      # angular_dist_threshold: 0.523599 #(30 degree) 0.785  #(45 degree)
      # forward_sampling_distance: 0.5
      # angular_disengage_threshold: 0.3925
      # rotate_to_heading_angular_vel: 1.0 #1.8
      # max_angular_accel: 2.5
      # simulate_ahead_time: 1.0
      # rotate_to_goal_heading: false
      # rotate_to_heading_once: false
      # closed_loop: true
      # use_path_orientations: true
      # #RPP parameters
      # plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # min_linear_vel: 0.5
      # max_linear_vel: 1.8
      # min_angular_vel: 0.83
      # max_angular_vel: 1.5
      # max_linear_accel: 2.5
      # max_linear_decel: -2.5
      # max_angular_accel: 1.0
      # max_angular_decel: -1.0
      # lookahead_dist: 2.0 # not being used when use_velocity_scaled_lookahead_dist: true
      # min_lookahead_dist: 1.6
      # max_lookahead_dist: 5.0
      # lookahead_time: 1.5
      # rotate_to_heading_angular_vel: 0.5
      # transform_tolerance: 0.12
      # use_velocity_scaled_lookahead_dist: true
      # min_approach_linear_velocity: 0.5
      # approach_velocity_scaling_dist: 0.6
      # use_collision_detection: true
      # max_allowed_time_to_collision_up_to_carrot: 1.5
      # use_regulated_linear_velocity_scaling: true
      # use_fixed_curvature_lookahead: false
      # interpolate_curvature_after_goal: true
      # curvature_lookahead_dist: 1.4
      # use_cost_regulated_linear_velocity_scaling: true
      # cost_scaling_dist: 1.5
      # cost_scaling_gain: 1.0
      # regulated_linear_scaling_min_radius: 0.9
      # regulated_linear_scaling_min_speed: 0.25
      # use_rotate_to_heading: false
      # allow_reversing: false
      # rotate_to_heading_min_angle: 0.785
      # max_angular_accel: 1.0
      # max_robot_pose_search_dist: 10.0
      # min_distance_to_obstacle: 0.4
      plugin: teb_local_planner::TebLocalPlannerROS

      teb_autosize: 1.0
      dt_ref: 0.2  #temporal resolution
      dt_hysteresis: 0.02
      max_samples: 500
      exact_arc_length: false
      feasibility_check_no_poses: 5
      publish_feedback: false
      control_lookahead_poses: 3

      global_plan_overwrite_orientation: false
      allow_init_with_backwards_motion: false
      max_global_plan_lookahead_dist: 10.0
      global_plan_viapoint_sep: 0.5
      global_plan_prune_distance: 1.0

