      no_outer_iterations: 2
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0

      weight_max_vel_x: 20.0
      weight_max_vel_theta: 15.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 1.0

      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 10.0
      weight_kinematics_turning_radius: 1.0

      weight_optimaltime: 70.0 #200.0
      weight_shortest_path: 20.0

      weight_obstacle: 80.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 150.0
      weight_dynamic_obstacle_inflation: 10.0

      weight_viapoint: 170.0
      weight_adapt_factor: 2.0

      shrink_horizon_backup: true
      shrink_horizon_min_duration: 10.0

      oscillation_recovery: true
      oscillation_v_eps: 0.15
      oscillation_omega_eps: 0.15
      oscillation_recovery_min_duration: 4.0
      oscillation_filter_duration: 5.0
  
# with this current configuration we can give goal as far as we can
# but Robot only reasons about() ~15 m globally and ~7.5 m locally at any moment(because of the costmaps size)
local_costmap:
  local_costmap:
    ros__parameters:
      #footprint: "[[1.165, 0.804], [1.165, -0.804], [-1.165, -0.804], [-1.165, 0.804]]"
      #footprint: "[[1.2, 1.1], [1.2, -1.1], [-1.2, -1.1], [-1.2, 1.1]]"
      # with this footprint the inscribed radius is 0.804((0.804*2)/2)
      # the circumscribed radius = 1.4158 (√((1.165*2)+(0.804*2))
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 1.0
      tf_buffer_duration: 20.0
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 1.42
      use_sim_time: True
      rolling_window: true
      width: 150 # 150 * 0.05 = 7.5 meters covers around the robot
      height: 150
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        track_unknown_space: true
        observation_sources: pointcloud2
        max_obstacle_height: 2.0
        footprint_clearing_enabled: true
        combination_method: 1
        pointcloud2:
          topic: /ouster_points
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 30.0
          obstacle_min_range: 1.3
          raytrace_max_range: 30.5
          raytrace_min_range: 0.5
          max_obstacle_height: 5.0
          min_obstacle_height: 0.15
          clearing: True
          marking: True  
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.8 # should be > circumscribed radius
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.3 #0.8 #1.5 # set this -1 if you want the voxels stay
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false #true
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_mark #lidar_clear
        lidar_mark:
          data_type: PointCloud2
          topic: /ouster_points
          # topic: /zed_camera/depth/points
          marking: true
          clearing: false
          obstacle_range: 30.0          # meters
          min_obstacle_height: 0.15     # default 0, meters
          max_obstacle_height: 5.0     # default 3, meters,
          expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false          # default false, for laser scans
          filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on     voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
        lidar_clear:
          enabled: true                #default true, can be toggled on/off with associated service call
          data_type: PointCloud2
          topic: /ouster_points
          # topic: /zed_camera/depth/points
          marking: false
          clearing: true
          max_z: 8.0                  # default 0, meters
          min_z: 0.1                  # default 10, meters
          vertical_fov_angle: 0.6     # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_padding: 0.05    # 3D Lidar only. Default 0, in meters 
          horizontal_fov_angle: 3.14  # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
          decay_acceleration: 5.0     # default 0, 1/s^2. 
          model_type: 1               # default 0, model type for frustum. 0=depth camera, 1=3d lidar
      always_send_full_costmap: True

# GPS Way Point Follower change Static layer removed    
global_costmap:
  global_costmap:
    ros__parameters:
      #footprint: "[[1.165, 0.804], [1.165, -0.804], [-1.165, -0.804], [-1.165, 0.804]]"
      #footprint: "[[1.2, 1.1], [1.2, -1.1], [-1.2, -1.1], [-1.2, 1.1]]"
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 1.0
      tf_buffer_duration: 20.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 1.42
      use_sim_time: True
      resolution: 0.05
      # When using GPS navigation you will potentially traverse huge environments which are not practical to
      # fit on a big static costmap. Thus it is recommended to use a rolling global costmap large enough to
      # contain each pair of successive waypoints. See: https://github.com/ros-planning/navigation2/issues/2174
      rolling_window: True
      width: 300 # 300 * 0.05 = 15 meters covers around the robot
      height: 300
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        track_unknown_space: true
        observation_sources: pointcloud2
        max_obstacle_height: 2.0
        footprint_clearing_enabled: true
        combination_method: 1
        pointcloud2:
          topic: /ouster_points
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 30.0
          obstacle_min_range: 1.3
          raytrace_max_range: 30.5
          raytrace_min_range: 0.5
          max_obstacle_height: 5.0
          min_obstacle_height: 0.15
          clearing: True
          marking: True  
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.8 # should be > circumscribed radius
      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: true
      #   subscribe_to_updates: true
      always_send_full_costmap: True

planner_server:  
  ros__parameters:
    expected_planner_frequency: 0.5
    tf_buffer_duration: 20.0 
    use_sim_time: True
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    service_introspection_mode: "disabled"   
    # GridBased:
    #   plugin: "nav2_smac_planner/SmacPlanner2D" 
    #   tolerance: 0.05                        # tolerance for planning if unable to reach exact pose, in meters
    #   downsample_costmap: false             # whether or not to downsample the map
    #   downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
    #   allow_unknown: true                   # allow traveling in unknown space
    #   max_iterations: -1               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
    #   max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
    #   max_planning_time: 5.0                # max time in s for planner to plan, smooth
    #   cost_travel_multiplier: 3.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
    #   use_final_approach_orientation: true # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
    #   smoother:
    #     max_iterations: 1000
    #     w_smooth: 0.3
    #     w_data: 0.2
    #     tolerance: 1.0e-10
    #     do_refinement: true
    #     refinement_num: 2
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice" # In Iron and older versions, "/" was used instead of "::"
      allow_unknown: true                 # Allow traveling in unknown space
      tolerance: 0.05                     # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.
      max_iterations: -1             # Maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 1.0            # Max time in s for planner to plan, smooth
      analytic_expansion_ratio: 2.0       # The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 3.0  # For Hybrid/Lattice nodes The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting
      analytic_expansion_max_cost: 200.0  # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: false  #  Whether or not to override the maximum cost setting if within critical distance to goal (ie probably required)
      reverse_penalty: 2.0                # Penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.05                # Penalty to apply if motion is changing directions (L to R), must be >= 0
      non_straight_penalty: 1.1          # Penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 3.0                   # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      rotation_penalty: 5.0               # Penalty to apply to in-place rotations, if minimum control set contains them
      retrospective_penalty: 0.015
      # lattice_filepath: ""              # The filepath to the state lattice graph
      lookup_table_size: 20.0             # Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false     # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      allow_reverse_expansion: false      # If true, allows the robot to use the primitives to expand in the mirrored opposite direction of the current robot's orientation (to reverse).
      coarse_search_resolution: 1         # Number of bins to skip when doing a coarse search for the path. Only used for all_direction goal heading mode.
      goal_heading_mode: "DEFAULT"        # DEFAULT, BIDIRECTIONAL, ALL_DIRECTION
      smooth_path: False 
    # GridBased:
    #   plugin: "nav2_navfn_planner/NavfnPlanner"
    #   tolerance: 0.05
    #   use_astar: false
    #   allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: "base_link"
    transform_tolerance: 0.12
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    behavior_plugins:
      ["spin", "assisted_teleop", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: false
      max_rotational_vel: 0.6
      min_rotational_vel: 0.3
      rotational_acc_lim: 1.8
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
      projection_time: 1.0
      simulation_time_step: 0.1
      cmd_vel_teleop: cmd_vel_teleop
      #use this remap command when teleop manually
      #ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r /cmd_vel:=/cmd_vel_teleop
      enable_stamped_cmd_vel: false
    backup:
      plugin: "nav2_behaviors/BackUp"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: false
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: false
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    service_introspection_mode: "disabled"
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable: false
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.0]
    min_velocity: [-2.0, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.01
    enable_stamped_cmd_vel: False
    use_realtime_priority: False

collision_monitor:
  ros__parameters:
    enabled: false
    use_sim_time: True
    enable_stamped_cmd_vel: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.12
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 1.0
    polygons: ["PolygonSlow", "PolygonStop"]      
    PolygonSlow:
      type: "polygon"
      points: [1.7, 1.1, 1.7, -1.1, -1.7, -1.1, -1.7, 1.1]
      action_type: "slowdown"
      min_points: 3  # max_points: 3 for Humble
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
    PolygonStop:
      type: "polygon"
      points: [1.5, 1.0, 1.5, -1.0, -1.5, -1.0, -1.5, 1.0]
      action_type: "stop"
      min_points: 3  # max_points: 3 for Humble
      visualize: True
      polygon_pub_topic: "polygon_stop"
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 5
      visualize: true
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/ouster_points"
      transport_type: "raw"
      min_height: 0.15
      max_height: 5.0
      min_range: 0.1
      enabled: True
